# Builds RubricVisionAI.exe on every push to master and keeps it as a downloadable artifact.
name: Build RubricVision AI

on:
  push:
    branches: [master]
  workflow_dispatch: # also lets you run it by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build RubricVisionAI.exe
        run: pyinstaller --noconfirm --clean RubricVisionAI.spec

      - name: Add config, rubric template and README
        shell: pwsh
        run: |
          Copy-Item config.json dist/
          Copy-Item README.md dist/
          # Blank template (column names only), generated from the code so it doesn't need to be in the repo.
          python -c "from rubricvision.rubric import write_blank_template; write_blank_template('dist/plantilla_rubrica.xlsx')"
          "SHORT_SHA=$(git rev-parse --short HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check the executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist/RubricVisionAI.exe)) { throw "dist/RubricVisionAI.exe was not created" }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload RubricVision AI for download
        uses: actions/upload-artifact@v7
        with:
          name: RubricVisionAI-windows-${{ env.SHORT_SHA }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
